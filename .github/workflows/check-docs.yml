name: Check documentation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/generate-cli-reference.py --check
      - run: python3 scripts/build-navigation.py --check
      - run: python3 scripts/check-docs.py
      - run: npx --yes mintlify@4.2.375 validate
      - run: npx --yes mintlify@4.2.375 broken-links
